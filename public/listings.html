<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منشورات الشقق — بيتك عندنا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="icon" href="/assets/brand.jpg" type="image/jpeg">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand-lockup" href="/">
        <img class="logo" src="/assets/brand.jpg" alt="شعار بيتك عندنا"
             onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex';">
        <span style="display:none;align-items:center;justify-content:center;background:var(--teal);color:#fff;font-weight:900;width:42px;height:42px;border-radius:50%;flex:0 0 auto;">ب</span>
        <span class="brand-name"><span class="brand">بيتك عندنا</span><br><span class="brand-tag">بيتك الجاي… بدايته هنا</span></span>
      </a>
      <span class="topbar-spacer"></span>
      <nav class="nav-inline">
        <a href="/index.html" class="ghost">الرئيسية</a>
        <a href="/request.html" class="btn hide-sm">اطلب شقة</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="section-title">منشورات الشقق</h1>

    <div class="search-bar">
      <input id="q" type="search" placeholder="ابحث بالمكان أو العنوان أو الوصف…" maxlength="80" autocomplete="off">
      <select id="type-filter" aria-label="نوع العرض">
        <option value="">كل الأنواع</option>
        <option value="إيجار">إيجار</option>
        <option value="بيع">بيع</option>
        <option value="أخرى">أخرى</option>
      </select>
    </div>

    <div class="ask-bar">
      <div>
        <p class="ab-t">مش لاقي الشقة اللي في بالك؟</p>
        <p class="ab-s">اكتب مواصفاتها وهنراجع طلبك ونتواصل معاك.</p>
      </div>
      <span class="ab-cta"><a href="/request.html" class="btn">اطلب شقة 📝</a></span>
    </div>

    <div id="list" aria-live="polite"></div>

    <div id="state" style="display:none">
      <div id="state-content"></div>
    </div>
  </main>

  <footer>© <span class="ltr">2026</span> بيتك عندنا</footer>
  <script src="/js/common.js"></script>
  <script src="/js/listings.js"></script>
</body>
</html>
